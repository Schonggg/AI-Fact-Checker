<style>
html, body, #root { height: 100%; margin: 0; }
html, body, #root {
  height: 100%;
}

* {
  scrollbar-width: thin;
  scrollbar-color: #21262D transparent;
}
*::-webkit-scrollbar { width: 4px; }
*::-webkit-scrollbar-track { background: transparent; }
*::-webkit-scrollbar-thumb { background: #21262D; border-radius: 2px; }

@keyframes blink   { 0%,100% { opacity:1 } 50% { opacity:0 } }
@keyframes ticker  { 0% { transform:translateX(0) } 100% { transform:translateX(-50%) } }
@keyframes spin    { to { transform:rotate(360deg) } }
@keyframes fadeIn  { from { opacity:0; transform:translateY(-6px) } to { opacity:1; transform:translateY(0) } }
@keyframes overlayIn { from { opacity:0 } to { opacity:1 } }
@keyframes modalIn { from { opacity:0; transform:scale(0.96) translateY(8px) } to { opacity:1; transform:scale(1) translateY(0) } }
@keyframes loader-orbit-cw { to { transform: rotate(360deg); } }
@keyframes loader-orbit-ccw { to { transform: rotate(-360deg); } }
@keyframes loader-core-pulse {
  0%, 100% { transform: scale(0.92); opacity: 0.72; filter: blur(0); }
  50% { transform: scale(1.08); opacity: 1; filter: blur(0.5px); }
}
@keyframes loader-scan {
  0% { transform: translateX(-120%); opacity: 0; }
  15%, 85% { opacity: 1; }
  100% { transform: translateX(120%); opacity: 0; }
}
@keyframes loader-step-glow {
  0%, 100% { opacity: 0.35; transform: translateY(0); }
  50% { opacity: 1; transform: translateY(-2px); }
}
@keyframes loader-progress-loop {
  0% { transform: translateX(-100%) scaleX(0.28); }
  45% { transform: translateX(12%) scaleX(0.62); }
  100% { transform: translateX(140%) scaleX(0.28); }
}

.cursor-blink   { animation: blink   1s step-end infinite; }
.ticker-track   { animation: ticker  30s linear infinite; }
.spin           { animation: spin    0.8s linear infinite; }
.fade-in        { animation: fadeIn  0.15s ease both; }
.overlay-in     { animation: overlayIn 0.2s ease both; }
.modal-in       { animation: modalIn 0.2s ease both; }
.loader-orbit-cw  { animation: loader-orbit-cw 3.2s linear infinite; transform-origin: 50% 50%; }
.loader-orbit-ccw { animation: loader-orbit-ccw 5.4s linear infinite; transform-origin: 50% 50%; }
.loader-core      { animation: loader-core-pulse 1.65s ease-in-out infinite; transform-origin: 50% 50%; }
.loader-scan      { animation: loader-scan 2.2s ease-in-out infinite; }
.loader-step-dot  { animation: loader-step-glow 1.6s ease-in-out infinite; }
.loader-progress  { animation: loader-progress-loop 2.35s cubic-bezier(0.45,0,0.2,1) infinite; transform-origin: left center; }

/* ─── Immersive Living Background ────────────────────────────────────────── */
@keyframes data-flow {
  0% { stroke-dashoffset: 1000; }
  100% { stroke-dashoffset: 0; }
}
.data-stream {
  stroke-dasharray: 20 80;
  animation: data-flow 4s linear infinite;
}
.data-stream-fast {
  stroke-dasharray: 10 50;
  animation: data-flow 2s linear infinite;
}

/* ─── Active Interconnections and Surges ─────────────────────────────────── */
@keyframes beam-flow {
  0% { stroke-dashoffset: 200; }
  100% { stroke-dashoffset: 0; }
}
.data-beam {
  stroke-dasharray: 15 30;
  animation: beam-flow 1.5s linear infinite;
  filter: drop-shadow(0 0 8px #818CF8);
}

/* ─── Truth Dashboard: breathing pulse ─────────────────────────────────── */
@keyframes truth-breathe {
  0%, 100% { filter: drop-shadow(0 0 5px rgba(129,140,248,0.28)); }
  50%       { filter: drop-shadow(0 0 11px rgba(129,140,248,0.45)); }
}
@keyframes text-pulse {
  0%, 100% { opacity: 0.92; filter: drop-shadow(0 0 6px rgba(129,140,248,0.30)); }
  50% { opacity: 1; filter: drop-shadow(0 0 10px rgba(129,140,248,0.5)); }
}
@keyframes ring-spin-cw {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}
@keyframes ring-spin-ccw {
  from { transform: rotate(360deg); }
  to { transform: rotate(0deg); }
}

.truth-gauge-breathe { animation: truth-breathe 5s ease-in-out infinite; }
.text-pulse          { animation: text-pulse 5s ease-in-out infinite; }
.ring-spin-cw        { animation: ring-spin-cw 12s linear infinite; transform-origin: 50% 50%; }
.ring-spin-ccw       { animation: ring-spin-ccw 18s linear infinite; transform-origin: 50% 50%; }

/* ─── Multi-Axis Analysis ──────────────────────────────────────────────── */
@keyframes radar-ripple {
  0% { transform: scale(0.96); opacity: 0.55; }
  50% { transform: scale(1.02); opacity: 0.32; }
  100% { transform: scale(0.96); opacity: 0.55; }
}
@keyframes radar-node-glow {
  0%, 100% { filter: drop-shadow(0 0 3px rgba(129,140,248,0.35)); opacity: 0.85; }
  50%       { filter: drop-shadow(0 0 7px rgba(129,140,248,0.65)); opacity: 1.00; }
}

.radar-node-pulse    { animation: radar-node-glow 4s ease-in-out infinite; }
.radar-ripple        { animation: radar-ripple 4.5s ease-in-out infinite; transform-origin: 50% 50%; }

/* ─── EAS Certificate ──────────────────────────────────────────────────── */
@keyframes digital-rain {
  0% { transform: translateY(-100%); }
  100% { transform: translateY(100%); }
}
.digital-rain-col {
  animation: digital-rain 5s linear infinite;
}

@keyframes trail-flow {
  0% { stroke-dashoffset: 400; }
  100% { stroke-dashoffset: 0; }
}
.light-trail {
  fill: none;
  stroke: #818CF8;
  stroke-width: 1.5;
  stroke-dasharray: 30 370;
  animation: trail-flow 6s linear infinite;
  filter: drop-shadow(0 0 3px #818CF8);
}

.eas-border-wrap {
  border-radius: 13px;
  padding: 1.5px;
  background: #161B22; /* Base fallback */
  box-shadow: 0 25px 50px rgba(0,0,0,0.8);
  position: relative;
}

/* ─── MINT button ───────────────────────────────────────────────────────── */
.mint-btn {
  transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
  background: linear-gradient(90deg, #818CF8, #6366F1);
}
.mint-btn:hover {
  transform: translateY(-1px);
  filter: brightness(1.08);
  box-shadow: 0 6px 20px rgba(129,140,248,0.35) !important;
}

/* ─── UI Micro-interactions ────────────────────────────────────────────── */

/* 1. Eco card spinning border highlight */
@keyframes eco-border-rot {
  to { transform: rotate(360deg); }
}
.eco-border-spin {
  animation: eco-border-rot 4.5s linear infinite;
  transform-origin: center;
}

/* 2. Hero Title */
.hero-title-anim {
  display: inline-block;
}
.hero-title-accent {
  display: inline-block;
  background: linear-gradient(90deg, #818CF8, #6366F1);
  color: transparent;
  -webkit-background-clip: text;
  background-clip: text;
  filter: drop-shadow(0 0 14px rgba(129,140,248,0.25));
}

/* 3. VERIFY CLAIM Button */
.verify-btn {
  transition: transform 0.15s ease, box-shadow 0.15s ease !important;
}
.verify-btn:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(129,140,248,0.35) !important;
}

/* 4. Top Navigation Links */
.nav-link {
  display: inline-block;
  cursor: pointer;
  transition: color 0.2s ease, transform 0.1s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.2s ease !important;
}
.nav-link:hover {
  color: #818CF8 !important;
  opacity: 1 !important;
}
.nav-link:active {
  transform: scale(0.95);
}
